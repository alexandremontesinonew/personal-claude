[tool.poetry]
name = "claude-desktop-automator"
version = "0.1.0"
description = "Automation system for Claude Desktop App with rate limit detection and auto-recovery"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "claude_automator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pyautogui = "^0.9.54"
pywinauto = "^0.6.8"
pytesseract = "^0.3.10"
Pillow = "^10.1.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
rich = "^13.7.0"
loguru = "^0.7.2"
pyperclip = "^1.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.1"
flake8 = "^7.0.0"
mypy = "^1.7.1"

[tool.poetry.scripts]
claude-automator = "claude_automator.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
